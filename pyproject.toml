[project]
name = "cleanplate"
version = "0.4.0"
description = "Self-hosted async video watermark detection, multi-ROI inpainting, and automated QA pipeline node built on FastAPI, ComfyUI, and FFmpeg"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "qilaidev"}]
requires-python = ">=3.11,<3.14"
keywords = [
  "watermark-removal",
  "watermark-detection",
  "video-inpainting",
  "subtitle-removal",
  "object-removal",
  "comfyui",
  "sam3",
  "fastapi",
  "ffmpeg",
  "opencv",
  "async-worker",
  "self-hosted",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "huggingface_hub>=0.24.0,<1",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.9.0",
  "pyyaml>=6.0.2",
  "python-multipart>=0.0.20",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.16",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.16",
]

[project.urls]
Homepage = "https://github.com/qilaidev/cleanplate"
Documentation = "https://github.com/qilaidev/cleanplate/blob/main/docs/api.md"
Repository = "https://github.com/qilaidev/cleanplate"
Issues = "https://github.com/qilaidev/cleanplate/issues"
Changelog = "https://github.com/qilaidev/cleanplate/blob/main/CHANGELOG.md"
Security = "https://github.com/qilaidev/cleanplate/blob/main/SECURITY.md"

[project.scripts]
cleanplate-api = "wm_platform.cli_api:main"
cleanplate-worker = "wm_platform.cli_worker:main"
cleanplate-scout = "wm_platform.model_scout:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["eval/dataset"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: long SQL/log strings; B008: FastAPI Depends()/Form() defaults; E402: tests put src/ on sys.path first.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B017"]
"apps/*" = ["E402"]
